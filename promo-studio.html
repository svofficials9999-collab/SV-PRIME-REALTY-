<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SV PRIME EDITS - Promo Video Studio</title>
<meta name="theme-color" content="#0b1020"><meta name="description" content="SV PRIME EDITS Promo Video Template Studio: 25 categories, 250 promo video templates. Edit and export on your phone.">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#070b18;color:#f5f6ff;font-family:'Noto Sans Telugu','Noto Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#0b1020f2,#0b1020d9);border-bottom:1px solid #ffd76a44;backdrop-filter:blur(8px)}
header img{height:40px;border-radius:8px}header .b{flex:1;line-height:1.15}header b{color:#ffd76a;font-size:15px;letter-spacing:.5px}header small{display:block;color:#9fe9ff;font-size:11px}
header a,header button{color:#ffd76a;border:1px solid #ffd76a88;background:#0000;border-radius:999px;padding:9px 12px;font-weight:700;font-size:13px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:12px 12px 60px}h2{font-size:20px;color:#ffd76a;margin:8px 0 10px}.badge{font-size:12px;background:#ffd76a22;border:1px solid #ffd76a66;border-radius:999px;padding:3px 10px;color:#fff;margin-left:6px;vertical-align:middle}
.sbox input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid #ffd76a88;background:#0d1530;color:#fff;font-size:16px;min-height:48px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:thin}.chip{flex:0 0 auto;border:1.5px solid #33d0ff77;background:#0d1530;color:#fff;border-radius:999px;padding:10px 14px;font-weight:700;font-size:13px;min-height:44px;cursor:pointer;white-space:nowrap}.chip.on{background:linear-gradient(135deg,#ffe38a,#d9a826);color:#1a1209;border-color:#ffd76a}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{display:block;background:#0d1530;border:1px solid #ffd76a44;border-radius:14px;padding:7px;color:#fff;text-decoration:none;overflow:hidden}.card canvas{width:100%;aspect-ratio:9/16;border-radius:9px;background:#111a38;display:block}
.cn{font-weight:800;font-size:13.5px;margin:7px 2px 3px;line-height:1.25}.cm{margin:0 2px}.tag{font-size:11px;color:#1a1209;background:#ffd76a;border-radius:6px;padding:2px 7px;font-weight:700;display:inline-block}.cm2{font-size:11px;color:#9fb0e6;margin:5px 2px 2px}
.none{text-align:center;color:#ffb3b3;padding:30px}
.ed .back{color:#7fe7ff;text-decoration:none;font-weight:700;display:inline-block;padding:10px 0;min-height:44px}.desc{color:#c8d2f5;font-size:14px}
.stage{display:flex;justify-content:center;background:#04070f;border:1px solid #ffd76a55;border-radius:14px;padding:8px;margin:10px 0}.stage canvas{border-radius:8px;background:#000}
.ctl{display:flex;align-items:center;gap:10px;margin-bottom:8px}.ctl input{flex:1;min-width:0}#tm{font-size:12px;color:#9fe9ff;min-width:80px;text-align:right}
.btn{background:#1a2550;color:#fff;border:1.5px solid #ffd76a88;border-radius:12px;padding:11px 16px;font-weight:800;font-size:14px;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.alt{background:#0d1530}.btn.big{width:100%;margin-top:8px;font-size:16px;background:linear-gradient(135deg,#ffe38a,#d9a826);color:#1a1209;border:0}.btn.gold{margin-top:16px}.btn:disabled{opacity:.5}
fieldset{border:1px solid #ffd76a44;border-radius:14px;margin:14px 0;padding:10px 12px;background:#0b1128}legend{color:#ffd76a;font-weight:800;padding:0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}label{font-size:13px;color:#c8d2f5;display:flex;flex-direction:column;gap:4px}label.up{width:100%}select,input[type=text],.fld input{background:#0d1530;color:#fff;border:1px solid #33d0ff77;border-radius:10px;padding:10px;font-size:15px;min-height:44px}
.fld{margin:8px 0}.fld b{display:block;font-size:13px;color:#7fe7ff;margin-bottom:4px}.fld input{width:100%;margin-bottom:5px}.hint{font-size:12px;color:#9fb0e6}
.sc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff14}.sc .sn{flex:1 0 100%;font-weight:800;color:#ffd76a;text-transform:capitalize}.sc button,.sc select{min-height:40px;min-width:40px;background:#0d1530;color:#fff;border:1px solid #ffd76a66;border-radius:8px;padding:6px 10px;font-weight:700}
progress{width:100%;height:12px;margin-top:8px}footer{text-align:center;color:#8896c8;font-size:12px;padding:20px}
</style></head><body>

function renderScenes(){var tp=P.tpl,box=$('#sclist');box.innerHTML='';$('#nsc').textContent=tp.scenes.length+' '+t('scenes')+' · '+E.total(tp).toFixed(1)+t('dur');
  tp.scenes.forEach(function(s,i){var d=document.createElement('div');d.className='sc';d.innerHTML='<span class="sn">'+(i+1)+'. '+s.k+'</span><button data-a="m" data-i="'+i+'">-</button><b>'+s.d.toFixed(1)+t('dur')+'</b><button data-a="p" data-i="'+i+'">+</button><select data-a="t" data-i="'+i+'">'+['fade','zoom','whip','flash','glitch','spin','mask','flip'].map(function(x){return '<option'+(P.trs[i]===x?' selected':'')+'>'+x+'</option>'}).join('')+'</select><button data-a="u" data-i="'+i+'" aria-label="'+t('up')+'">↑</button><button data-a="d" data-i="'+i+'" aria-label="'+t('down')+'">↓</button><button data-a="c" data-i="'+i+'">'+t('add')+'</button><button data-a="x" data-i="'+i+'">'+t('del')+'</button>';box.appendChild(d)});
  box.onclick=function(e){var b=e.target.closest('button');if(!b)return;var i=+b.dataset.i,a=b.dataset.a,S=tp.scenes;
    if(a==='m')S[i].d=Math.max(1,+(S[i].d-0.5).toFixed(1));else if(a==='p')S[i].d=Math.min(8,+(S[i].d+0.5).toFixed(1));
    else if(a==='u'&&i>0){var x=S[i];S[i]=S[i-1];S[i-1]=x;var y=P.trs[i];P.trs[i]=P.trs[i-1];P.trs[i-1]=y}
    else if(a==='d'&&i<S.length-1){var x2=S[i];S[i]=S[i+1];S[i+1]=x2;var y2=P.trs[i];P.trs[i]=P.trs[i+1];P.trs[i+1]=y2}
    else if(a==='c'&&S.length<12){S.splice(i+1,0,JSON.parse(JSON.stringify(S[i])));P.trs.splice(i+1,0,P.trs[i])}
    else if(a==='x'&&S.length>1){S.splice(i,1);P.trs.splice(i,1)}
    renderScenes();draw()};
  box.onchange=function(e){var s=e.target;if(s.dataset.a==='t'){P.trs[+s.dataset.i]=s.value;draw()}}}
function fit(){var cv=$('#cv');var s=sizeFor(P.ratio,'720');var maxW=Math.min(window.innerWidth-32,420),maxH=Math.round(window.innerHeight*0.62);var sc=Math.min(maxW/s[0],maxH/s[1]);cv.width=Math.round(s[0]*Math.min(1,540/s[0]));cv.height=Math.round(cv.width*s[1]/s[0]);cv.style.width=Math.round(s[0]*sc)+'px';cv.style.height=Math.round(s[1]*sc)+'px';draw()}
function draw(){var cv=$('#cv');if(!cv)return;var T=E.total(P.tpl);tpos=Math.min(tpos,T);try{E.render(cv.getContext('2d'),cv.width,cv.height,tpos,P)}catch(x){console.error(x)}
  $('#tm').textContent=tpos.toFixed(1)+' / '+T.toFixed(1);$('#scrub').value=Math.round(tpos/T*1000)}
function seekVideo(){if(P.media.video&&!play){try{P.media.video.currentTime=tpos%(P.media.video.duration||1)}catch(e){}}if(audioEl){try{audioEl.currentTime=tpos}catch(e){}}}
function levels(){if(!an)return null;var a=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(a);return a}
function loop(ts){if(!play)return;var T=E.total(P.tpl);tpos=(ts-t0)/1000;if(tpos>=T){tpos=T;draw();stop();return}P.levels=levels();draw();raf=requestAnimationFrame(loop)}
function start(){if(play||exporting)return;var T=E.total(P.tpl);if(tpos>=T-0.05)tpos=0;play=true;$('#pp').textContent=t('pause');t0=performance.now()-tpos*1000;if(P.media.video){P.media.video.currentTime=tpos%(P.media.video.duration||1);P.media.video.play().catch(function(){})}
  if(audioEl){audioEl.currentTime=tpos;audioEl.play().catch(function(){})}raf=requestAnimationFrame(loop)}
function stop(){play=false;cancelAnimationFrame(raf);var b=$('#pp');if(b)b.textContent=t('play');if(P&&P.media.video)P.media.video.pause();if(audioEl)audioEl.pause();if(P)P.levels=null}
function setAudio(url){if(audioEl){audioEl.pause()}audioEl=new Audio(url);audioEl.crossOrigin='anonymous';msg('Audio ready');try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var src=actx.createMediaElementSource(audioEl);an=actx.createAnalyser();an.fftSize=128;var dest=actx.createMediaStreamDestination();src.connect(an);an.connect(actx.destination);an.connect(dest);audioEl._dest=dest}catch(e){}}
function toggleRec(){if(recMed){recMed.stop();return}if(!navigator.mediaDevices||!window.MediaRecorder){msg('Voice recording is not supported here');return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){var ch=[];recMed=new MediaRecorder(st);recMed.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};recMed.onstop=function(){st.getTracks().forEach(function(x){x.stop()});var b=new Blob(ch,{type:recMed.mimeType||'audio/webm'});recMed=null;$('#rec').textContent=t('rec');setAudio(URL.createObjectURL(b));msg('Voice recorded')};recMed.start();$('#rec').textContent=t('stop');msg('Recording...')}).catch(function(){msg('Microphone permission denied')})}
function doExport(){if(exporting)return;var ex=$('#exs');if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){ex.textContent=t('unsup');return}
  stop();var s=sizeFor(P.ratio,P.q),cv=document.createElement('canvas');cv.width=s[0];cv.height=s[1];var ctx=cv.getContext('2d');var T=E.total(P.tpl);
  var types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'],mt='';for(var i=0;i<types.length;i++){if(MediaRecorder.isTypeSupported(types[i])){mt=types[i];break}}
  if(!mt){ex.textContent=t('unsup');return}
  var stream=cv.captureStream(30);if(audioEl&&audioEl._dest){audioEl._dest.stream.getAudioTracks().forEach(function(a){stream.addTrack(a)})}
  var rec,chunks=[];try{rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:s[0]>=1000?8e6:4e6})}catch(e){ex.textContent='Export failed: '+e.message;return}
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};exporting=true;$('#ex').disabled=true;var pr=$('#exp');pr.hidden=false;ex.textContent=t('exporting')+' ('+s[0]+'x'+s[1]+', '+(mt.indexOf('mp4')>-1?'MP4':'WebM')+')';
  rec.onstop=function(){exporting=false;$('#ex').disabled=false;pr.hidden=true;if(!chunks.length){ex.textContent='Export failed: no data recorded';return}var b=new Blob(chunks,{type:mt.split(';')[0]});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SVPRIME-'+P.tpl.id+(mt.indexOf('mp4')>-1?'.mp4':'.webm');document.body.appendChild(a);a.click();a.remove();ex.textContent=t('done')+' ('+(b.size/1048576).toFixed(1)+' MB)'};
  var st=performance.now();if(P.media.video){P.media.video.currentTime=0;P.media.video.play().catch(function(){})}if(audioEl){audioEl.currentTime=0;audioEl.play().catch(function(){})}rec.start(500);
  (function f(){var el=(performance.now()-st)/1000;P.levels=levels();if(el>=T){P.levels=null;E.render(ctx,cv.width,cv.height,T,P);setTimeout(function(){rec.stop();if(audioEl)audioEl.pause();if(P.media.video)P.media.video.pause()},300);return}
    E.render(ctx,cv.width,cv.height,el,P);pr.value=el/T*100;requestAnimationFrame(f)})()}
// ---------- router ----------
function route(){var h=location.hash||'#/';var m;stop();window.scrollTo(0,0);
  if((m=h.match(/^#\/t\/(C\d\d-S\d\d)$/))){renderEditor(m[1]);return}
  if((m=h.match(/^#\/c\/(C\d\d)$/))&&CATBY[m[1]])state.cat=m[1];else state.cat='all';renderLib()}
window.addEventListener('hashchange',route);
document.addEventListener('DOMContentLoaded',function(){applyUI();$('#uiLang').onclick=function(){ui=ui==='te'?'en':'te';try{localStorage.setItem('svps.ui',ui)}catch(e){}applyUI();route()};route()});
window.SVPS={cats:CATS.length,subs:TPL.length};
})();
